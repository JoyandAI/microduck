# robotd — per-robot parameters.
#
# Installed to /etc/robot/robotd.toml. Read once at startup, not watched: changing
# anything here needs `systemctl restart robotd`. Live reload is deferred
# (docs/design/robotd-design.md §7.2).
#
# It lives here, and not under /opt/robot/daemon/releases/<ver>/, on purpose: this is
# per-robot configuration rather than a shipped default, so it must survive an update
# *and* a rollback (docs/design/architecture.md §3). The installer never overwrites it.
#
# Every value below is the built-in default. The file may be deleted entirely — an
# unprovisioned board comes up on these same numbers rather than refusing to start, which
# is far easier to diagnose remotely than a daemon that will not run.

[bus]
# Serial port the 15 servos and the imu_to_dxl board share. /dev/ttyS2 is the Radxa
# Zero 3W's wiring; a board wired differently can also be overridden per-invocation with
# `robotd --port`, which is the dev escape hatch rather than the thing to edit here.
port = "/dev/ttyS2"

# Every value below that is commented out shows the built-in default. LEAVE IT COMMENTED
# unless this robot genuinely needs a different value: install.sh copies this file to
# /etc/robot/robotd.toml once and never overwrites it, so an uncommented value is frozen on
# the board forever while releases move on. That is exactly how a fleet ended up standing at
# kP 120 while the release default said 160.

[control]
# Control loop rate, Hz.
#
# 50 is inherited from the prototype, where it was chosen on a Raspberry Pi Zero 2W. It
# has never been re-derived on the Radxa. Before trusting it, measure: `bench_dynamixel_bus`
# in microduck_runtime reports achieved rate, jitter, bus utilisation and error counts at a
# given rate, and the loop's own five-minute summary reports the same from inside robotd.
hz = 50

# Per-tick EMA smoothing on incoming commands: `cmd += alpha * (target - cmd)`. The
# prototype's `--cmd-alpha` / `--head-alpha` — a stick snap becomes a ramp the gait can
# follow. 1.0 is pass-through. `cmd_alpha` covers the velocity twist; `head_alpha` covers
# head targets and the body pose.
# cmd_alpha = 0.2
# head_alpha = 0.2

[update_gate]
# What decides `healthy`, and therefore what the update system rolls back on.
#
# This is the whole point of the daemon in its current form: the updater's auto-rollback is
# only meaningful if that verdict is a real measurement. A loop running at 60% of target is
# alive, answers every request, and is badly broken — these three thresholds are what
# distinguish that from a working robot.
#
# Named `update_gate` rather than `health` because `robot.health` reports much more than
# this: battery, motor temperature, loop and bus counters. None of those may reach a verdict
# — a release must never be rolled back for the state of the board it landed on — so none of
# them is configured here.

# Achieved rate floor. Below this, unhealthy. 45 is 90% of the default 50 Hz: loose enough
# not to trip on one slow tick, tight enough that a loop dropping every tenth cycle is not
# called healthy. Raise it in step with `control.hz`.
# min_achieved_hz = 45.0

# How many periods may pass with no tick at all before the loop counts as WEDGED. This is
# what turns a hung control thread into an honest "unhealthy" instead of a socket that
# keeps answering "healthy" on the strength of one tick it managed an hour ago.
#
# It detects a dead loop, not a slow one — min_achieved_hz above owns degradation. Keep the
# two apart. This was originally 3 (60 ms at 50 Hz), which ordinary scheduler jitter on a
# busy board exceeds routinely; a health check that trips on jitter rolls back good
# releases. 25 periods is 500 ms: a loop silent that long is genuinely gone.
# stall_periods = 25

# Consecutive failed bus reads tolerated. One dropped transaction is ordinary on a serial
# bus; a run of them means the bus is gone, and a robot that cannot read its own joints is
# not healthy whatever rate the loop is spinning at.
# max_consecutive_errors = 10

[policy]
# Whether to load a policy at all.
#
# `false` runs the loop and holds whatever pose the robot started in, and stays healthy
# doing it. That is a legitimate configuration, not a degraded one: it is the safest thing
# to be doing while hammering install / rollback / power-cut cycles at a bench, because
# nothing falls over when a deliberately broken release lands.
#
# It is deliberately distinct from a policy that was wanted and could not be loaded — that
# reports unhealthy, so the updater rolls the release back. `robotd --no-policy` sets this
# from the command line.
enabled = true

# Drive mode: "walk" (legs, the default) or "roller". The mode changes which policies load
# AND the tuning defaults below — every value left unset resolves per mode, so switching a
# robot to the roller is this one line plus `systemctl restart robotd`. The roller preset
# is the prototype launcher's, rebased on the alpha defaults as its installer now is:
# roller.onnx as the locomotion policy, the crouch on the ground-pick trigger (3.0 s, 0.8),
# action_scale 0.8 — and everything else as walking has it: sit/stand, kicks, roulade, the
# trained low-pass. Only the standing network stays out: the prototype loads it in roller
# mode and then never runs it, standing transitions being skipped on wheels.
mode = "walk"

# Policy files. Unset means the mode's default inside the release directory, so an ordinary
# update carries the policies alongside the binaries that were trained against them. Point
# one at your own .onnx to try a build without cutting a release — the loop anyone
# iterating on gait runs. The literal "none" disables an optional slot outright.
#
# All must be 61-input, 14-output: every alpha policy is obs[1,61] -> actions[1,14], and
# robotd checks that at load rather than discovering it mid-stride. (microduck_runtime also
# ships a 51-D family — legacy 3-value command — which robotd refuses at load with
# "observation width is 51, expected 61".)
#
# Walk-mode defaults, spelled out:
# walk        = ".../current/policies/alpha_walking.onnx"     the velstand gait
# stand       = ".../current/policies/alpha_stand.onnx"       standing + body pose
# sitstand    = ".../current/policies/alpha_sitstand.onnx"    sit <-> stand, posture flag
# ground_pick = ".../current/policies/alpha_ground_pick.onnx" A-button pick
# kick_left   = ".../current/policies/ball_kick_left.onnx"
# kick_right  = ".../current/policies/ball_kick_right.onnx"
# roulade     = ".../current/policies/roulade.onnx"          X-button forward roll

# Requires ONNX Runtime on the board. It is dlopened, not linked, so a missing library is
# a startup failure rather than a build one — robotd reports it through robot.health and
# holds its pose. scripts/install.sh installs it; ORT_DYLIB_PATH overrides where to look.

# Scales raw policy output into a joint offset. Unset resolves per mode: 0.9 walking (the
# prototype's current alpha default), 0.8 roller.
# action_scale = 0.9

# The standing policy is trained to be applied whole.
# standing_action_scale = 1.0
# Standing runs softer, at this fraction of `gain`. The prototype's --standing-kp-ratio.
# standing_gain_ratio = 0.8
# Position P gain while running.
# gain = 200

# First-order low-pass on the head and leg joint targets, as a blend factor in (0, 1].
# 1.0 is pass-through (off). Unset resolves per mode: 0.5 / 0.7 walking — the values the
# alpha policies are TRAINED with (mjlab ACTION_LOW_PASS_{HEAD,LEG}_ALPHA); they must match
# training or transfer degrades. Both modes: the rebased roller preset keeps them too.
# head_lowpass = 0.5
# legs_lowpass = 0.7

# The ground pick: one cycle length in seconds (the move hands back at 70% of the cycle,
# as the prototype does), its action scale, and a gain multiplier while it runs. Unset
# period/scale resolve per mode: 4.0 / 1.0 walking, 3.0 / 0.8 for the roller crouch.
# ground_pick_period = 4.0
# ground_pick_action_scale = 1.0
# ground_pick_gain_ratio = 1.0

# How long a kick window stays on the kick network, seconds.
# kick_duration = 0.5

# One roulade — one forward roll, seconds (the prototype's measured single-roll time).
# Holding X chains rolls of this length; the roll in flight always completes. The scale
# and gain multiplier apply while a roll runs — 1.0 means full walking values, which is
# what the roll is trained against.
# roulade_duration = 1.0
# roulade_action_scale = 1.0
# roulade_gain_ratio = 1.0

# Scale actions with battery voltage: effective scale = action_scale * (nominal / measured
# EMA, clamped 6.0..9.5 V). The servos' effective kP tracks their supply, so this holds the
# robot's response steady as the pack sags. Off by default, as in the prototype.
# voltage_adapt = false
# nominal_voltage = 7.4

[safety]
# Fall detection, on projected gravity in the trunk frame. Upright reads about -1.0 on z;
# a robot on its side reads near 0. Debounced, because the impulse from a firm footfall
# would otherwise read as a fall — and dropping the robot mid-stride is how you cause one.
# fall_gravity_z = -0.5
# fall_debounce_ms = 200

# How long the robot goes without a velocity intent before it stops.
#
# Stop, not limp: losing contact with a client should leave a biped standing, because
# standing is its safe state. Losing balance is the other event, and it goes limp instead.
# deadman_ms = 500

# Whether a detected fall preempts anything: hold at gain_limp, refuse init/enable/skills
# until upright. OFF by default, as the prototype is — a fallen robot keeps being driven
# and the humans stay in charge; the fall verdict still shows in robotctl monitor either
# way. fall_recover = true implies this (recovery starts with the limp settle).
# fall_limp = false

# Gain once fallen (only used when fall_limp/fall_recover arms the gate) — low enough to
# yield rather than fight the floor.
# gain_limp = 50

# Stand back up after a fall, on its own: limp 0.3 s so the robot settles, then the
# standing network drives until the robot has been solidly upright (gravity z < -0.85) for
# a full second. While this is on, the standing network is RESERVED for recovery and body
# pose — command magnitude no longer selects it. Off by default, matching the prototype's
# `--fall-detect` flag.
# fall_recover = false

# Sit down gracefully and power the machine off when the battery EMA reaches the empty
# floor (6.6 V — the same value the battery percentage maps to 0%). The EMA moves over
# ~10 s, so a load sag cannot trip it; reaching 6.6 requires a genuinely spent pack.
# battery_empty_shutdown = true

[audio]
# The robot's voice (the seeded synth bank under /var/lib/robot/sounds — rendered by the
# release's postinstall, `sounds ensure-bank`) and its ear (the petting classifier on the
# onboard mic). All optional equipment: a board without the codec walks identically and
# stays quiet, and nothing here reaches a health verdict.
# enabled = true

# ALSA playback device — the TLV320AIC3104 codec that setup-board.sh brings up. The mic
# worker captures from "<device>,0".
# device = "plughw:aic3104"

# Where the voice bank lives.
# bank = "/var/lib/robot/sounds"

# Listen for petting on the onboard mic and coo about it. Unset resolves per mode, as the
# prototype's launcher did: on for walking, off for the roller. The model ships in the
# release (models/pet_detect.onnx); "none" disables it outright; thresholds are the
# classifier's hysteresis (enter above, leave below).
# pet_detect = true
# pet_model = ".../current/models/pet_detect.onnx"
# pet_enter_threshold = 0.95
# pet_exit_threshold = 0.85
