[package]
name = "robotd-params"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "robotd's startup parameters — the schema, the defaults, and the validation"

# Extracted from `robotd/src/params.rs` verbatim so that `robotctl configure` can edit the
# file with the real types, the real defaults and the real validation, instead of a copied
# schema that drifts. `robotd` re-exports this as `crate::params`, so nothing there changed.
[dependencies]
serde = { workspace = true }
toml = "0.9"
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.27.0"
